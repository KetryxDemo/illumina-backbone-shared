name: Debug Ketryx auth

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/v1/build-artifacts with masked hash
        env:
          KEY: ${{ secrets.KETRYX_API_KEY }}
        run: |
          echo "key length: ${#KEY}"
          echo "key prefix: ${KEY:0:10}"
          echo "key suffix: ${KEY: -6}"
          echo "---"
          curl -sS -o /tmp/out -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/octet-stream" \
            "https://demo.ketryx.com/api/v1/build-artifacts?project=KXPRJ01M2G8YQ1XEMWBFKAGW0H46W8E" \
            --data-binary "diag" || true
          cat /tmp/out || true
          echo ""
          echo "---probe /api/v1/builds:"
          curl -sS -o /tmp/out2 -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            "https://demo.ketryx.com/api/v1/builds" \
            -d '{"project":"KXPRJ01M2G8YQ1XEMWBFKAGW0H46W8E","commitSha":"2222222222222222222222222222222222222222"}' || true
          cat /tmp/out2 || true
